version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16 # Imagem oficial do Postgres já com a extensão pgvector inclusa
    container_name: postgres_ia_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: medical-appontiment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: